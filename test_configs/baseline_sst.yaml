# Baseline Configuration (Generic Controller - No FlexProf)
# 
# Uses the same SSTTrace frontend as FlexProf configs for fair comparison.
# The Generic controller does NOT implement FlexProf's domain isolation.
#
# Trace format: <R|W> <address> <domain_id>

Frontend:
  impl: SSTTrace
  clock_ratio: 8
  max_requests: 0         # Run until trace completes
  wrap_trace: false
  path: example_sst_trace.trace

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR4_2400R

  Controller:
    impl: Generic
    
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4

  AddrMapper:
    impl: RoBaRaCoCh
