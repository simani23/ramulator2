# FlexProf Static Controller Configuration
# 
# Uses the same SSTTrace frontend as other configs for fair comparison.
# FlexProfStatic implements pre-configured turn-based domain scheduling.
#
# Trace format: <R|W> <address> <domain_id>

Frontend:
  impl: SSTTrace
  clock_ratio: 8
  max_requests: 0         # Run until trace completes
  wrap_trace: false
  path: example_sst_trace.trace

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR4_2400R

  Controller:
    impl: FlexProfStatic
    
    # Number of security domains (must cover all domain IDs in trace)
    num_domains: 4
    
    # Default turns per domain
    default_turn_allocation: 1
    
    # Default read/write bias (0.0=all writes, 1.0=all reads)
    default_rw_bias: 0.5
    
    # Per-domain queue size
    queue_size: 64
    
    # Static per-domain turn allocations
    # Domain 0: 2 turns (more bandwidth)
    # Domains 1-3: 1 turn each
    domain_turn_allocations: [2, 1, 1, 1]
    
    # Static per-domain R/W biases
    # Domain 0: 0.8 = read-heavy
    # Domain 1: 0.3 = write-heavy
    # Domain 2: 0.5 = balanced
    # Domain 3: 1.0 = all reads
    domain_rw_biases: [0.8, 0.3, 0.5, 1.0]
    
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4

  AddrMapper:
    impl: RoBaRaCoCh
