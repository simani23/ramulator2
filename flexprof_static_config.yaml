# FlexProf Static Controller Configuration
# 
# This configuration uses the FlexProfStatic controller which implements
# FlexProf's memory-controller isolation mechanism with STATIC (pre-configured)
# turn-based domain scheduling.
#
# Key Features:
# - Per-domain read/write queues for temporal isolation
# - Static per-domain service turn allocation (configured at startup, never changes)
# - Static read/write scheduling bias per domain (configured at startup, never changes)
# - Turn-based round-robin scheduling across domains
#
# SST Integration:
# - SST provides: domain_id (via source_id), read/write type, address
# - Controller implements: temporal isolation via pre-computed static turn schedule
#
# The turn schedule is computed ONCE at initialization from:
# - domain_turn_allocations: how many turns each domain gets per round
# - domain_rw_biases: ratio of read vs write turns per domain (0.0=all writes, 1.0=all reads)
#
# Example with 4 domains:
#   allocations = [2, 1, 1, 1]  -> Domain 0 gets 2 turns, others get 1 turn each
#   biases = [0.8, 0.3, 0.5, 1.0] -> Domain 0: 80% reads, Domain 1: 30% reads, etc.
#
# Resulting static schedule (repeats forever):
#   Turn 0: Domain 0, Read
#   Turn 1: Domain 0, Read  (80% of 2 = ~1.6, rounded to 2 reads, 0 writes)
#   Turn 2: Domain 1, Write (30% of 1 = 0 reads, 1 write)
#   Turn 3: Domain 2, Read  (50% of 1 = 1 read or write alternating)
#   Turn 4: Domain 3, Read  (100% = all reads)
#
# Trace format: <R|W> <address> <domain_id>

Frontend:
  impl: SSTTrace
  clock_ratio: 8
  max_requests: 0         # 0 = run until trace completes
  wrap_trace: false       # Don't loop the trace
  path: example_sst_trace.trace

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 3

  DRAM:
    impl: DDR4
    org:
      preset: DDR4_8Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR4_2400R

  Controller:
    impl: FlexProfStatic
    
    # Number of security domains
    num_domains: 4
    
    # Default turns per domain
    default_turn_allocation: 1
    
    # Default read/write bias
    # 0.0 = all writes, 1.0 = all reads, 0.5 = balanced
    default_rw_bias: 0.5
    
    # Per-domain queue size (separate read/write queues per domain)
    queue_size: 64
    
    # Static per-domain turn allocations
    # Higher allocation = more bandwidth for that domain
    # Domain 0 : gets 2 turns
    # Domain 1 : gets 1 turn
    # Domain 2 : gets 1 turn
    # Domain 3 : gets 2 turns
    domain_turn_allocations: [2, 1, 1, 2]
    
    # Static per-domain R/W biases
    # Tailored to each domain's workload characteristics
    # Domain 0: 0.8 = read-heavy
    # Domain 1: 0.3 = write-heavy
    # Domain 2: 0.5 = balanced
    # Domain 3: 1.0 = all reads
    domain_rw_biases: [0.8, 0.3, 0.5, 1.0]
    
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: ClosedRowPolicy
      cap: 4

  AddrMapper:
    impl: RoBaRaCoCh
